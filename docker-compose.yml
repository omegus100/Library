# Library — self-hosted stack (Portainer, Synology Container Manager, or plain Docker).
# Pulls the ready-made image from GitHub (ghcr.io/omegus100/library); nothing is built on the NAS.
# Full guide: DOCKER.md
#
# Settings (Portainer: "Environment variables" on the stack; plain Docker: a .env file next to this):
#   SESSION_SECRET  required  long random string (signs sign-ins)
#   APP_PORT        8080      port on the NAS
#   IMAGE_TAG       latest    or a version like 2.0.0
#   MONGO_IMAGE     mongo:7   use mongo:4.4 if the database container keeps restarting
#                             (older NAS CPUs without AVX can't run MongoDB 5+)
#   MONGO_DATA      named volume "mongo-data", or a NAS folder like /volume1/docker/library/db
#   COVERS_DATA     named volume "covers",     or a NAS folder like /volume1/docker/library/covers
#   BACKUP_DATA     named volume "backups",    or a NAS folder like /volume1/docker/library/backups
#   CLIENT_ORIGIN   only if another site calls this API (normally leave unset)
#   GOOGLE_BOOKS_API_KEY  optional
#
# To build the image yourself instead of pulling it:
#   docker compose -f docker-compose.yml -f docker-compose.build.yml up -d --build

services:
  app:
    image: ghcr.io/omegus100/library:${IMAGE_TAG:-latest}
    container_name: library-app
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/library
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (a long random string)}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      COVER_STORAGE: local
      COVER_DIR: /data/covers
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    volumes:
      - ${COVERS_DATA:-covers}:/data/covers

  mongo:
    image: ${MONGO_IMAGE:-mongo:7}
    container_name: library-mongo
    restart: unless-stopped
    volumes:
      - ${MONGO_DATA:-mongo-data}:/data/db
      - ${BACKUP_DATA:-backups}:/backups
    healthcheck:
      # mongosh exists in MongoDB 6+, the older "mongo" shell in 4.x/5.x.
      # Generous timings: on low-power NAS CPUs the shell alone can take 10+ seconds to start.
      test: ["CMD-SHELL", "mongosh --quiet --norc --eval 'db.adminCommand(\"ping\").ok' 2>/dev/null || mongo --quiet --norc --eval 'db.adminCommand(\"ping\").ok'"]
      interval: 30s
      timeout: 30s
      retries: 10
      start_period: 120s
    # No ports published: only the app container can reach the database.

volumes:
  mongo-data:
  covers:
  backups:
