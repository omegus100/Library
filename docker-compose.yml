# Library — one container. Database (SQLite) and covers live in /data.
# Pulls the ready-made image from GitHub (ghcr.io/omegus100/library); nothing is built on the NAS.
# Full guide: DOCKER.md
#
# Settings (Portainer: the stack's "Environment variables"; plain Docker: a .env file next to this):
#   SESSION_SECRET  required  long random string (signs sign-ins)
#   DATA_PATH       library-data   where data lives: a Docker volume name, or a NAS folder like /volume1/docker/library
#   PUID / PGID     1000 / 1000    owner of the files in DATA_PATH (Synology: your user's uid/gid, e.g. 1026 / 100)
#   APP_PORT        8080           port on the NAS
#   IMAGE_TAG       latest         or a version like 2.0.0
#   TZ              UTC            timezone, e.g. America/New_York
#   GOOGLE_BOOKS_API_KEY           optional
#   CALIBRE_LIBRARY_PATH           optional: your Calibre library folder (the one with metadata.db), e.g. /volume1/Media/Books
#                                  Mounted read-only at /calibre. Turn it on in the app: Settings → Calibre ebooks.

services:
  library:
    image: ghcr.io/omegus100/library:${IMAGE_TAG:-latest}
    # Always fetch the newest image for this tag on deploy (otherwise an old cached copy can be reused)
    pull_policy: always
    container_name: library
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:5000"
    environment:
      SESSION_SECRET: ${SESSION_SECRET:?Set SESSION_SECRET (a long random string)}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      TZ: ${TZ:-UTC}
      GOOGLE_BOOKS_API_KEY: ${GOOGLE_BOOKS_API_KEY:-}
    volumes:
      - ${DATA_PATH:-library-data}:/data
      # Calibre library, read-only (an empty placeholder when CALIBRE_LIBRARY_PATH isn't set)
      - ${CALIBRE_LIBRARY_PATH:-calibre-none}:/calibre:ro

volumes:
  library-data:
  calibre-none:
