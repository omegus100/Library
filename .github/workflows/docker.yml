# Builds the Docker image and publishes it to GitHub Container Registry:
#   ghcr.io/omegus100/library:latest   (every push to main)
#   ghcr.io/omegus100/library:2.0.0    (when a tag like v2.0.0 is pushed)
#   ghcr.io/omegus100/library:sha-abc1234
# Your NAS (Portainer / Container Manager) pulls it, so nothing is built on the NAS.
# Images are built for Intel/AMD (amd64) and ARM (arm64) NAS models.

name: Docker image

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch: # "Run workflow" button in the Actions tab, for any branch

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/library
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=ref,event=branch,enable=${{ github.ref_name != 'main' }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
